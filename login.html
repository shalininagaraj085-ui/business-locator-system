<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Business Locator System</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>Business Locator System</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="business.html">Businesses</a>

        <a href="search.html">Search</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>



<section class="page-section">

    <h2>Login</h2>


    <form id="loginForm">


        <label>
            Email
        </label>


        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <p>

        Don't have an account?

        <a href="register.html">
            Register here
        </a>

    </p>


</section>



<footer>

    <p>
        © 2026 Business Locator System.
        All Rights Reserved.
    </p>

</footer>



<script>


/* ===============================
   BACKEND LOGIN API
================================ */

const API_URL =
    "http://localhost:5000/api/users/login";



/* ===============================
   LOGIN FORM
================================ */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                .getElementById("loginEmail")
                .value
                .trim();


            const password =
                document
                .getElementById("loginPassword")
                .value;


            try {


                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );



                const data =
                    await response.json();



                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid email or password"
                    );

                }



                /* ===============================
                   LOGIN SUCCESS
                ================================ */

                sessionStorage.setItem(
                    "userLoggedIn",
                    "true"
                );


                sessionStorage.setItem(
                    "userName",
                    data.user.name
                );


                sessionStorage.setItem(
                    "userEmail",
                    data.user.email
                );


                alert(
                    "Login successful! ✅"
                );


                window.location.href =
                    "index.html";


            }

            catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                alert(
                    "Login failed! ❌\n\n" +
                    error.message
                );

            }

        }
    );


</script>


</body>

</html>
