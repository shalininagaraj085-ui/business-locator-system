<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Business Locator System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<header>

    <h1>Business Locator System</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="business.html">Businesses</a>

        <a href="search.html">Search</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

        <a href="contact.html">Contact</a>

        <a href="admin.html">Admin</a>

    </nav>

</header>


<section class="page-section">

    <h2>👤 User Registration</h2>

    <form id="registerForm">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required>


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required>


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required>


        <button type="submit">

            📝 Register

        </button>

    </form>

</section>


<footer>

    <p>
        © 2026 Business Locator System.
        All Rights Reserved.
    </p>

</footer>


<script>

const API_URL =
    "http://localhost:5000/api/users";


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                .getElementById("name")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const user = {

                name: name,

                email: email,

                password: password

            };


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(user)
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Registration failed"
                    );

                }


                alert(
                    "Registration successful! ✅"
                );


                document
                    .getElementById("registerForm")
                    .reset();


            }

            catch (error) {

                console.error(
                    error
                );


                alert(
                    "Registration failed! ❌\n\n" +
                    error.message
                );

            }

        }
    );

</script>


</body>

</html>
