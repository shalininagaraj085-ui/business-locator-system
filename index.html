<body>

<header>

    <h1>Business Locator System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="business.html">Businesses</a>
        <a href="search.html">Search</a>

        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin Dashboard</a>
    </nav>
<p id="welcomeUser"></p>

<button onclick="logoutUser()">Logout</button>
</header>

<section class="page-section">

    <h2>Find Nearby Businesses Easily</h2>

    <p>Search businesses by name or category.</p>

    <a href="search.html">
        <button>Search Business</button>
    </a>

</section>

<footer>

    <p>© 2026 Business Locator System. All Rights Reserved.</p>

</footer>
<script>

let userName = localStorage.getItem("userName");

if (userName) {
    document.getElementById("welcomeUser").innerText =
        "Welcome, " + userName + "!";
}

function logoutUser() {

    localStorage.removeItem("userName");
    localStorage.removeItem("userEmail");
    localStorage.removeItem("userPassword");

    alert("Logout successful!");

    window.location.href = "login.html";
}

</script>
</body>
