<script>

/* ==================================================
   BACKEND API
================================================== */

const API_URL = "/api/businesses";

const FAVORITE_API_URL = "/api/favorites";

const REVIEW_API_URL = "/api/reviews";


/* ==================================================
   LOAD BUSINESSES
================================================== */

loadBusinesses();


async function loadBusinesses() {

    const container =
        document.getElementById("businessContainer");

    container.innerHTML = `
        <p>
            Loading businesses from MongoDB... ⏳
        </p>
    `;

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Backend API Error");
        }

        const businesses = await response.json();

        if (!Array.isArray(businesses)) {
            throw new Error("Invalid business data");
        }

        await displayBusinesses(businesses);

    }

    catch (error) {

        console.error(
            "Business Loading Error:",
            error
        );

        container.innerHTML = `
            <div class="business-card">

                <h3>
                    ❌ Unable to load businesses
                </h3>

                <p>
                    Backend connection failed.
                </p>

                <p>
                    Please check the server and MongoDB connection.
                </p>

            </div>
        `;
    }
}


/* ==================================================
   DISPLAY BUSINESSES
================================================== */

async function displayBusinesses(businesses) {

    const container =
        document.getElementById("businessContainer");

    container.innerHTML = "";

    if (businesses.length === 0) {

        container.innerHTML = `
            <div class="business-card">

                <h3>
                    No businesses found.
                </h3>

                <p>
                    Please add businesses from Admin Dashboard.
                </p>

            </div>
        `;

        return;
    }


    for (
        let index = 0;
        index < businesses.length;
        index++
    ) {

        const business = businesses[index];

        let rating = 0;
        let reviewCount = 0;

        /* ------------------------------------------
           GET REVIEWS
        ------------------------------------------ */

        try {

            const reviewResponse =
                await fetch(
                    REVIEW_API_URL +
                    "/" +
                    encodeURIComponent(
                        business.name
                    )
                );

            if (reviewResponse.ok) {

                const reviews =
                    await reviewResponse.json();

                if (Array.isArray(reviews) &&
                    reviews.length > 0) {

                    const total =
                        reviews.reduce(
                            function(sum, item) {

                                return sum +
                                    Number(item.rating || 0);

                            },
                            0
                        );

                    rating =
                        total / reviews.length;

                    reviewCount =
                        reviews.length;
                }
            }

        }

        catch (error) {

            console.log(
                "Review loading error:",
                error
            );

        }


        /* ------------------------------------------
           IMAGE
        ------------------------------------------ */

        const image =
            business.image ||
            getCategoryImage(
                business.category
            );


        /* ------------------------------------------
           CREATE CARD
        ------------------------------------------ */

        const card =
            document.createElement("div");

        card.className =
            "business-card";


        /* ------------------------------------------
           RATING DISPLAY
        ------------------------------------------ */

        let stars = "";

        if (rating > 0) {

            const roundedRating =
                Math.round(rating);

            for (
                let i = 1;
                i <= 5;
                i++
            ) {

                stars +=
                    i <= roundedRating
                        ? "⭐"
                        : "☆";
            }

        } else {

            stars = "☆☆☆☆☆";
        }


        card.innerHTML = `

            <!-- BUSINESS IMAGE -->

            <img
                src="${image}"
                alt="${escapeHTML(
                    business.name
                )}"
                class="business-image"
                onerror="
                    this.onerror=null;
                    this.src='images/medical.jpg';
                "
            >


            <!-- BUSINESS NAME -->

            <h3>

                🏪
                ${escapeHTML(
                    business.name
                )}

            </h3>


            <!-- CATEGORY -->

            <p>

                <b>Category:</b>

                ${escapeHTML(
                    business.category
                )}

            </p>


            <!-- LOCATION -->

            <p>

                <b>Location:</b>

                ${escapeHTML(
                    business.location
                )}

            </p>


            <!-- PHONE -->

            <p>

                <b>Phone:</b>

                ${escapeHTML(
                    business.phone
                )}

            </p>


            <!-- RATING -->

            <p>

                <b>Rating:</b>

                ${stars}

                ${
                    rating > 0
                    ? " " + rating.toFixed(1) + "/5"
                    : " No ratings yet"
                }

                ${
                    reviewCount > 0
                    ? " (" + reviewCount + " reviews)"
                    : ""
                }

            </p>


            <!-- VIEW DETAILS -->

            <button
                type="button"
                onclick="viewDetails(
                    '${escapeJS(
                        business.name
                    )}',
                    '${escapeJS(
                        business.location
                    )}',
                    '${escapeJS(
                        business.phone
                    )}'
                )"
            >

                🔎 View Details

            </button>


            <!-- GOOGLE MAPS -->

            <button
                type="button"
                onclick="viewLocation(
                    '${escapeJS(
                        business.name
                    )}',
                    '${escapeJS(
                        business.location
                    )}'
                )"
            >

                📍 View Location

            </button>


            <!-- FAVORITE -->

            <button
                type="button"
                onclick="addFavorite(
                    '${escapeJS(
                        business.name
                    )}'
                )"
            >

                ❤️ Add to Favorites

            </button>


            <!-- REVIEW -->

            <div class="review-box">

                <h4>

                    ⭐ Rate & Review

                </h4>


                <select
                    id="rating${index}"
                >

                    <option value="">
                        Select Rating
                    </option>

                    <option value="1">
                        ⭐
                    </option>

                    <option value="2">
                        ⭐⭐
                    </option>

                    <option value="3">
                        ⭐⭐⭐
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐
                    </option>

                    <option value="5">
                        ⭐⭐⭐⭐⭐
                    </option>

                </select>


                <textarea
                    id="review${index}"
                    placeholder="Write your review"
                ></textarea>


                <button
                    type="button"
                    onclick="submitReview(
                        'rating${index}',
                        'review${index}',
                        '${escapeJS(
                            business.name
                        )}'
                    )"
                >

                    ⭐ Submit Review

                </button>

            </div>

        `;


        container.appendChild(card);

    }

}


/* ==================================================
   CATEGORY IMAGE
================================================== */

function getCategoryImage(category) {

    const value =
        String(category || "")
            .toLowerCase()
            .trim();


    if (
        value === "shopping mall" ||
        value === "shoppingmall" ||
        value === "shopping" ||
        value === "mall" ||
        value.includes("shopping")
    ) {

        return "images/shoppingmall.jpg.png";

    }


    if (
        value === "bakery" ||
        value.includes("bakery")
    ) {

        return "images/bakery.jpg.png";

    }


    if (
        value === "hospital" ||
        value.includes("hospital")
    ) {

        return "images/hospital.png.png";

    }


    if (
        value === "hotel" ||
        value.includes("hotel")
    ) {

        return "images/hotel.jpg.png";

    }


    if (
        value === "medical" ||
        value === "medical center" ||
        value === "medical centre" ||
        value.includes("medical")
    ) {

        return "images/medical.jpg";

    }


    if (
        value === "restaurant" ||
        value === "food" ||
        value === "food shop" ||
        value.includes("restaurant")
    ) {

        return "images/restaurant.jpg.png";

    }


    if (
        value === "supermarket" ||
        value === "super market" ||
        value.includes("supermarket")
    ) {

        return "images/supermarket.jpg.png";

    }


    return "images/medical.jpg";

}


/* ==================================================
   VIEW DETAILS
================================================== */

async function viewDetails(
    name,
    location,
    phone
) {

    let message =
        "Business Name: " +
        name +

        "\n\nLocation: " +
        location +

        "\n\nPhone: " +
        phone;


    try {

        const response =
            await fetch(
                REVIEW_API_URL +
                "/" +
                encodeURIComponent(name)
            );


        if (response.ok) {

            const reviews =
                await response.json();


            if (
                Array.isArray(reviews) &&
                reviews.length > 0
            ) {

                const total =
                    reviews.reduce(
                        function(sum, item) {

                            return sum +
                                Number(
                                    item.rating || 0
                                );

                        },
                        0
                    );


                const average =
                    total / reviews.length;


                message +=
                    "\n\n⭐ Rating: " +
                    average.toFixed(1) +
                    "/5";


                message +=
                    "\n📝 Reviews: " +
                    reviews.length;


                message +=
                    "\n\n--- Reviews ---";


                reviews.forEach(
                    function(item) {

                        message +=
                            "\n\n⭐ " +
                            item.rating +
                            "/5";


                        if (item.review) {

                            message +=
                                "\n" +
                                item.review;
                        }

                    }
                );

            } else {

                message +=
                    "\n\n⭐ Rating: No ratings yet";


                message +=
                    "\n📝 Reviews: No reviews yet";

            }

        }

    }

    catch (error) {

        console.error(
            "Details Error:",
            error
        );

    }


    alert(message);

}


/* ==================================================
   GOOGLE MAPS
================================================== */

function viewLocation(
    name,
    location
) {

    const query =
        encodeURIComponent(
            name +
            " " +
            location
        );


    window.open(

        "https://www.google.com/maps/search/?api=1&query=" +
        query,

        "_blank"

    );

}


/* ==================================================
   FAVORITES
================================================== */

async function addFavorite(
    businessName
) {

    const email =
        sessionStorage.getItem(
            "userEmail"
        );


    if (!email) {

        alert(
            "Please login first to add Favorites! ❌"
        );


        window.location.href =
            "login.html";


        return;

    }


    try {

        const response =
            await fetch(
                FAVORITE_API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            businessName:
                                businessName

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to add favorite"
            );

        }


        alert(
            businessName +
            " added to Favorites ❤️"
        );

    }


    catch (error) {

        console.error(
            "Favorite Error:",
            error
        );


        alert(
            "Favorite failed! ❌\n\n" +
            error.message
        );

    }

}


/* ==================================================
   SUBMIT REVIEW
================================================== */

async function submitReview(
    ratingId,
    reviewId,
    businessName
) {

    const ratingElement =
        document.getElementById(
            ratingId
        );


    const reviewElement =
        document.getElementById(
            reviewId
        );


    if (
        !ratingElement ||
        !reviewElement
    ) {

        alert(
            "Review fields not found! ❌"
        );

        return;

    }


    const rating =
        ratingElement.value;


    const review =
        reviewElement.value.trim();


    if (rating === "") {

        alert(
            "Please select a rating! ⭐"
        );

        return;

    }


    if (review === "") {

        alert(
            "Please write a review! ✍️"
        );

        return;

    }


    const email =
        sessionStorage.getItem(
            "userEmail"
        );


    if (!email) {

        alert(
            "Please login first to submit a review! ❌"
        );


        window.location.href =
            "login.html";


        return;

    }


    try {

        const response =
            await fetch(
                REVIEW_API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            businessName:
                                businessName,

                            rating:
                                Number(rating),

                            review:
                                review

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Review submission failed"
            );

        }


        alert(
            "Review submitted successfully! ⭐"
        );


        ratingElement.value = "";

        reviewElement.value = "";


        /* REFRESH BUSINESSES */

        await loadBusinesses();

    }


    catch (error) {

        console.error(
            "Review Error:",
            error
        );


        alert(
            "Review failed! ❌\n\n" +
            error.message
        );

    }

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {

    return String(value || "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   ESCAPE JAVASCRIPT
================================================== */

function escapeJS(value) {

    return String(value || "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r?\n/g,
            "\\n"
        );

}

</script>
